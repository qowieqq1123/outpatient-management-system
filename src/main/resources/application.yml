spring:
  application:
    name: outpatient
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/outpatient?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:outpatient_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # V1.7 审计在业务事务释放连接后才申请独立连接，50 并发业务请求共用连接池。
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  cors:
    allowed-origins: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:4174,http://localhost:4174
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET}
    jwt-expire-minutes: 720
  crypto:
    aes-key: ${APP_CRYPTO_AES_KEY}
  insurance:
    mode: NORMAL
    fund-ratio: 0.70
    endpoint: http://insurance.local/api/settle
  queue:
    miss-minutes: 3
    insert-behind: 3
